# Despliegue a Vercel desde acá, no desde la conexión de Git de Vercel ni
# desde la máquina de nadie.
#
# Por qué: con la conexión de Git, Vercel (plan Hobby) bloquea los deploys de
# commits cuyo autor no es el dueño del proyecto. Desplegando con el CLI y un
# token, el deploy queda a nombre del dueño del token sin importar quién
# escribió el commit — así cualquiera del equipo puede abrir PRs y producción
# sale sola al mergear a main.
#
# Hace falta cargar tres secrets en GitHub (Settings > Secrets and variables >
# Actions):
#   VERCEL_TOKEN       -> vercel.com/account/tokens
#   VERCEL_ORG_ID      -> el "orgId" de .vercel/project.json
#   VERCEL_PROJECT_ID  -> el "projectId" de .vercel/project.json
#
# Ojo: el repo es público. Los PRs que vienen de un fork no reciben secrets,
# así que no tienen preview (el job se saltea). Los de ramas del propio repo sí.
name: Desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # si se pushea dos veces seguidas, sólo importa el último
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  desplegar:
    # sin secrets (PR desde un fork) no hay nada que desplegar
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global vercel@latest

      # Producción: sólo cuando algo entra a main (o sea, al mergear un PR).
      - name: Traer variables de producción
        if: github.event_name == 'push'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Compilar
        if: github.event_name == 'push'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Desplegar a producción
        if: github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # PR a main: un deploy de preview con su propia URL, para probar antes
      # de mergear. Usa las variables del entorno "Preview" de Vercel.
      - name: Traer variables de preview
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Compilar preview
        if: github.event_name == 'pull_request'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Desplegar preview
        if: github.event_name == 'pull_request'
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
